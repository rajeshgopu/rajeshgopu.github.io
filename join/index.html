<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d1b">
    <title>Join a Neon XO Arena game</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090d1b; color: #fff; font: 16px system-ui, sans-serif; }
      main { width: min(88vw, 420px); padding: 32px; text-align: center; background: #141a2d; border: 1px solid #19d3ff66; border-radius: 24px; box-sizing: border-box; }
      h1 { color: #19d3ff; } p { color: #c3c9d8; line-height: 1.5; }
      a { display: inline-block; margin-top: 12px; padding: 14px 22px; color: #090d1b; background: #19d3ff; border-radius: 14px; font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>Neon XO Arena</h1>
      <p>Open this invitation on an Android device with Neon XO Arena installed. If the app is not installed, get it from Google Play and ask your friend to send the invitation again.</p>
      <a href="https://play.google.com/store/apps/details?id=com.gopu.tic.tac.toe.game">Get the game</a>
    </main>
  </body>
</html>
